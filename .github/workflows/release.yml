name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: false
        type: string

permissions:
  contents: write

env:
  APP_NAME: krayN
  DOTNET_VERSION: "10.0.x"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
            tag="nightly-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  core:
    name: Core ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: krayn-core-windows-amd64.exe
            uninstaller_artifact: krayn-uninstall-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: krayn-core-windows-arm64.exe
            uninstaller_artifact: krayn-uninstall-windows-arm64.exe
          - goos: linux
            goarch: amd64
            artifact: krayn-core-linux-amd64
            uninstaller_artifact: ""
          - goos: linux
            goarch: arm64
            artifact: krayn-core-linux-arm64
            uninstaller_artifact: ""
          - goos: darwin
            goarch: amd64
            artifact: krayn-core-darwin-amd64
            uninstaller_artifact: ""
          - goos: darwin
            goarch: arm64
            artifact: krayn-core-darwin-arm64
            uninstaller_artifact: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod

      - name: Test core
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: core
        run: go test ./...

      - name: Build core
        shell: bash
        working-directory: core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist/core
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${GITHUB_SHA::7}" \
            -o "../dist/core/${{ matrix.artifact }}" \
            ./cmd/krayn-core
          if [[ -n "${{ matrix.uninstaller_artifact }}" ]]; then
            go build -trimpath \
              -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${GITHUB_SHA::7}" \
              -o "../dist/core/${{ matrix.uninstaller_artifact }}" \
              ./cmd/krayn-uninstall
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/core/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        if: matrix.uninstaller_artifact != ''
        with:
          name: ${{ matrix.uninstaller_artifact }}
          path: dist/core/${{ matrix.uninstaller_artifact }}

  dotnet-tests:
    name: .NET tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore tests
        run: dotnet restore v2rayN\ServiceLib.Tests\ServiceLib.Tests.csproj

      - name: Test ServiceLib
        run: dotnet test v2rayN\ServiceLib.Tests\ServiceLib.Tests.csproj -c Debug --no-restore

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [prepare, core, dotnet-tests]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: win-x64
            core_artifact: krayn-core-windows-amd64.exe
            uninstaller_artifact: krayn-uninstall-windows-amd64.exe
          - arch: arm64
            rid: win-arm64
            core_artifact: krayn-core-windows-arm64.exe
            uninstaller_artifact: krayn-uninstall-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.core_artifact }}
          path: dist/core

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.uninstaller_artifact }}
          path: dist/core

      - name: Publish desktop app
        shell: pwsh
        run: |
          dotnet publish v2rayN\v2rayN.Desktop\v2rayN.Desktop.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -o dist\publish\windows-${{ matrix.arch }}

      - name: Stage Windows package
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $publish = "dist\publish\windows-$arch"
          $stage = "dist\stage\krayN-$version-windows-$arch"
          New-Item -ItemType Directory -Force "$stage\bin\kray" | Out-Null
          Copy-Item "$publish\*" "$stage" -Recurse -Force
          Copy-Item "dist\core\${{ matrix.core_artifact }}" "$stage\bin\kray\krayn-core.exe" -Force
          Copy-Item "dist\core\${{ matrix.uninstaller_artifact }}" "$stage\krayn-uninstall.exe" -Force
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\release\krayN-$version-windows-$arch.zip" -Force

      - name: Create Windows installer
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) {
              return $cmd.Source
            }

            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "$env:RUNNER_TEMP\InnoSetup6\ISCC.exe"
            )
            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            return $null
          }

          function Try-Install-InnoSetup {
            $iscc = Find-Iscc
            if ($iscc) {
              return $iscc
            }

            if (Get-Command choco -ErrorAction SilentlyContinue) {
              try {
                choco install innosetup -y --no-progress
              } catch {
                Write-Warning "Chocolatey Inno Setup install failed: $($_.Exception.Message)"
              }
              $iscc = Find-Iscc
              if ($iscc) {
                return $iscc
              }
            }

            if (Get-Command winget -ErrorAction SilentlyContinue) {
              try {
                winget install --id JRSoftware.InnoSetup -e -s winget --silent --accept-package-agreements --accept-source-agreements
              } catch {
                Write-Warning "winget Inno Setup install failed: $($_.Exception.Message)"
              }
              $iscc = Find-Iscc
              if ($iscc) {
                return $iscc
              }
            }

            $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "InnoSetup6"
            Invoke-WebRequest `
              -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
              -OutFile $installer
            Start-Process `
              -FilePath $installer `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$installDir" `
              -Wait

            return Find-Iscc
          }

          $iscc = Try-Install-InnoSetup
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          Write-Host "Using Inno Setup compiler: $iscc"

          $version = "${{ needs.prepare.outputs.version }}"
          $stage = "dist\stage\krayN-$version-windows-${{ matrix.arch }}"
          $iss = @"
          [Setup]
          AppId=io.krayn.krayN
          AppName=krayN
          AppVersion=$version
          AppPublisher=krayN
          DefaultDirName={autopf}\krayN
          DefaultGroupName=krayN
          OutputDir=dist\release
          OutputBaseFilename=krayN-$version-windows-amd64-setup
          Compression=lzma
          SolidCompression=yes
          CloseApplications=no
          RestartApplications=no
          ShowLanguageDialog=auto
          UsePreviousLanguage=no
          UninstallDisplayName=krayN
          UninstallDisplayIcon={app}\krayN.exe
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"
          [InstallDelete]
          Type: filesandordirs; Name: "{app}\bin"
          Type: filesandordirs; Name: "{app}\binConfigs"
          Type: filesandordirs; Name: "{app}\guiConfigs"
          Type: filesandordirs; Name: "{app}\data"
          Type: files; Name: "{app}\krayn-core.exe"
          Type: files; Name: "{app}\uninstall-krayN.ps1"
          [Files]
          Source: "$stage\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{group}\krayN"; Filename: "{app}\krayN.exe"
          Name: "{group}\Uninstall krayN"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\krayN"; Filename: "{app}\krayN.exe"; Tasks: desktopicon
          [UninstallRun]
          Filename: "{app}\krayn-uninstall.exe"; Parameters: "--all-users --skip-install-dir --silent"; Flags: runhidden waituntilterminated; RunOnceId: "krayNCompleteCleanup"
          [UninstallDelete]
          Type: filesandordirs; Name: "{userappdata}\krayN"
          Type: filesandordirs; Name: "{userappdata}\v2rayN"
          Type: filesandordirs; Name: "{localappdata}\krayN"
          Type: filesandordirs; Name: "{localappdata}\krayn"
          Type: filesandordirs; Name: "{localappdata}\v2rayN"
          Type: filesandordirs; Name: "{app}\bin"
          Type: filesandordirs; Name: "{app}\binConfigs"
          Type: filesandordirs; Name: "{app}\guiBackups"
          Type: filesandordirs; Name: "{app}\guiConfigs"
          Type: filesandordirs; Name: "{app}\guiFonts"
          Type: filesandordirs; Name: "{app}\guiLogs"
          Type: filesandordirs; Name: "{app}\guiTemps"
          Type: filesandordirs; Name: "{app}\data"
          Type: files; Name: "{app}\krayN.exe"
          Type: files; Name: "{app}\krayn-uninstall.exe"
          Type: dirifempty; Name: "{app}"
          [Code]
          procedure KillKrayNProcesses();
          var
            ResultCode: Integer;
          begin
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /T /IM krayN.exe', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /T /IM krayn-core.exe', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
          end;

          function InitializeSetup(): Boolean;
          begin
            KillKrayNProcesses();
            Result := True;
          end;

          function InitializeUninstall(): Boolean;
          begin
            KillKrayNProcesses();
            Result := True;
          end;
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $setup = "dist\release\krayN-$version-windows-amd64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Inno Setup finished without producing $setup"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: krayN-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}
          path: |
            dist/release/krayN-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}.zip
            dist/release/krayN-${{ needs.prepare.outputs.version }}-windows-amd64-setup.exe
          if-no-files-found: ignore

  linux:
    name: Linux ${{ matrix.arch }}
    needs: [prepare, core, dotnet-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            deb_arch: amd64
            core_artifact: krayn-core-linux-amd64
          - arch: arm64
            rid: linux-arm64
            deb_arch: arm64
            core_artifact: krayn-core-linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.core_artifact }}
          path: dist/core

      - name: Publish desktop app
        run: |
          dotnet publish v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o dist/publish/linux-${{ matrix.arch }}

      - name: Stage Linux packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          arch="${{ matrix.arch }}"
          stage="dist/stage/krayN-${version}-linux-${arch}"
          mkdir -p "${stage}/bin/kray" dist/release
          cp -a "dist/publish/linux-${arch}/." "${stage}/"
          install -m 755 "dist/core/${{ matrix.core_artifact }}" "${stage}/bin/kray/krayn-core"
          install -m 755 "packaging/uninstall/uninstall-unix.sh" "${stage}/uninstall-krayN.sh"
          tar -C "dist/stage" -czf "dist/release/krayN-${version}-linux-${arch}.tar.gz" "krayN-${version}-linux-${arch}"

          pkg="dist/pkg/krayN_${version}_${{ matrix.deb_arch }}"
          mkdir -p "${pkg}/opt/krayN" "${pkg}/usr/share/applications" "${pkg}/usr/share/icons/hicolor/256x256/apps" "${pkg}/DEBIAN"
          cp -a "${stage}/." "${pkg}/opt/krayN/"
          cat > "${pkg}/usr/share/applications/krayN.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=krayN
          Exec=/opt/krayN/krayN
          Icon=krayN
          Categories=Network;
          EOF
          cp v2rayN/v2rayN.Desktop/v2rayN.png "${pkg}/usr/share/icons/hicolor/256x256/apps/krayN.png"
          cat > "${pkg}/DEBIAN/control" <<EOF
          Package: krayn
          Version: ${version}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libc6
          Maintainer: krayN
          Description: Desktop GUI client for kray KLESS nodes
          EOF
          dpkg-deb --build "${pkg}" "dist/release/krayN-${version}-linux-${arch}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: krayN-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            dist/release/krayN-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/release/krayN-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.deb

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [prepare, core, dotnet-tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: osx-x64
            runner: macos-15-intel
            core_artifact: krayn-core-darwin-amd64
          - arch: arm64
            rid: osx-arm64
            runner: macos-15
            core_artifact: krayn-core-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.core_artifact }}
          path: dist/core

      - name: Publish desktop app
        run: |
          dotnet publish v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o dist/publish/macos-${{ matrix.arch }}

      - name: Build macOS app and DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          arch="${{ matrix.arch }}"
          app="dist/stage/krayN.app"
          mkdir -p "${app}/Contents/MacOS/bin/kray" "${app}/Contents/Resources" dist/release dist/dmg
          cp -a "dist/publish/macos-${arch}/." "${app}/Contents/MacOS/"
          install -m 755 "dist/core/${{ matrix.core_artifact }}" "${app}/Contents/MacOS/bin/kray/krayn-core"
          install -m 755 "packaging/uninstall/uninstall-unix.sh" "${app}/Contents/Resources/uninstall-krayN.sh"
          cp v2rayN/v2rayN.Desktop/v2rayN.icns "${app}/Contents/Resources/krayN.icns"
          cat > "${app}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>krayN</string>
            <key>CFBundleIdentifier</key><string>io.krayn.krayN</string>
            <key>CFBundleName</key><string>krayN</string>
            <key>CFBundleDisplayName</key><string>krayN</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleIconFile</key><string>krayN.icns</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          EOF
          cp -R "${app}" dist/dmg/
          cp packaging/uninstall/uninstall-unix.sh dist/dmg/uninstall-krayN.sh
          chmod +x dist/dmg/uninstall-krayN.sh
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "krayN" -srcfolder dist/dmg -ov -format UDZO "dist/release/krayN-${version}-macos-${arch}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: krayN-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/release/krayN-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.dmg

  checksums:
    name: Checksums
    needs: [prepare, core, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: krayN-*
          path: dist/release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: krayn-core-*
          path: dist/release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: krayn-uninstall-*
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum * > SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*

  release:
    name: Publish GitHub Release
    needs: [prepare, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: krayN ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/release/*
